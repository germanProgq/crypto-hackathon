# Local docker compose for crypto-hack services.
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
          until mongosh --host mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; do
            sleep 1;
          done;
          mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); }';
          i=0;
          while [ "$$i" -lt 30 ]; do
            state="$$(mongosh --host mongo --quiet --eval 'try { rs.status().myState } catch (e) { print(0) }')";
            if [ "$$(echo "$$state" | tr -d '\r\n')" = "1" ]; then
              exit 0;
            fi;
            sleep 1;
            i=$$((i + 1));
          done;
          exit 1;
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  auction-engine:
    image: crypto-hack-auction-engine:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: auction-engine
      HTTP_PORT: "4001"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:auction-engine"]
    ports:
      - "4001:4001"
    volumes:
      - ./src:/app/src
  ledger:
    image: crypto-hack-ledger:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: ledger
      HTTP_PORT: "4002"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:ledger"]
    ports:
      - "4002:4002"
    volumes:
      - ./src:/app/src
  crypto-gateway:
    image: crypto-hack-crypto-gateway:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: crypto-gateway
      HTTP_PORT: "4003"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:crypto-gateway"]
    ports:
      - "4003:4003"
    volumes:
      - ./src:/app/src
  bot:
    image: crypto-hack-bot:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: bot
      HTTP_PORT: "4004"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
    command: ["npm", "run", "dev:bot"]
    ports:
      - "4004:4004"
    volumes:
      - ./src:/app/src
  web:
    image: crypto-hack-web:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: web
      HTTP_PORT: "4005"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:web"]
    ports:
      - "4005:4005"
    volumes:
      - ./src:/app/src
  workers:
    image: crypto-hack-workers:local
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_NAME: workers
      HTTP_PORT: "4006"
      MONGO_URI: mongodb://mongo:27017/crypto_hack?replicaSet=rs0&directConnection=true
      MONGO_DB: crypto_hack
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:workers"]
    ports:
      - "4006:4006"
    volumes:
      - ./src:/app/src
volumes:
  mongo-data:
